<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1a"/>
      <stop offset="50%" stop-color="#0a1f36"/>
      <stop offset="100%" stop-color="#081525"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="wave1g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave2g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave3g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="860" height="200" rx="8"/>
    </clipPath>
  </defs>

  <rect width="860" height="200" fill="url(#bg)" rx="8"/>

  <!-- Waves -->
  <g clip-path="url(#clip)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-860 0" dur="6s" repeatCount="indefinite"/>
      <path d="M0,145 C60,130 100,160 160,145 C220,130 260,160 320,145 C380,130 420,160 480,145 C540,130 580,160 640,145 C700,130 740,160 800,145 C840,135 860,145 860,145 C920,130 960,160 1020,145 C1080,130 1120,160 1180,145 C1240,130 1280,160 1340,145 C1400,130 1440,160 1500,145 C1560,130 1600,160 1660,145 C1700,135 1720,145 1720,145 L1720,200 L0,200 Z" fill="url(#wave1g)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-860 0" dur="9s" repeatCount="indefinite"/>
      <path d="M0,158 C80,143 130,168 200,155 C270,142 310,168 380,155 C450,142 490,168 560,155 C630,142 670,168 740,155 C800,144 840,158 860,155 C940,143 990,168 1060,155 C1130,142 1170,168 1240,155 C1310,142 1350,168 1420,155 C1490,142 1530,168 1600,155 C1660,144 1700,158 1720,155 L1720,200 L0,200 Z" fill="url(#wave2g)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-860 0" dur="12s" repeatCount="indefinite"/>
      <path d="M0,168 C50,160 90,175 140,168 C190,161 230,175 280,168 C330,161 370,175 420,168 C470,161 510,175 560,168 C610,161 650,175 700,168 C750,161 800,170 860,168 C910,160 950,175 1000,168 C1050,161 1090,175 1140,168 C1190,161 1230,175 1280,168 C1330,161 1370,175 1420,168 C1470,161 1510,175 1560,168 C1610,161 1660,170 1720,168 L1720,200 L0,200 Z" fill="url(#wave3g)"/>
    </g>
  </g>

  <!-- Corner brackets -->
  <g stroke="#4fc3f7" stroke-width="1.5" opacity="0.4">
    <line x1="28" y1="18" x2="72" y2="18"/>
    <line x1="28" y1="18" x2="28" y2="58"/>
    <line x1="788" y1="18" x2="832" y2="18"/>
    <line x1="832" y1="18" x2="832" y2="58"/>
    <line x1="28" y1="182" x2="72" y2="182"/>
    <line x1="28" y1="142" x2="28" y2="182"/>
    <line x1="788" y1="182" x2="832" y2="182"/>
    <line x1="832" y1="142" x2="832" y2="182"/>
  </g>

  <!-- Pulsing dots -->
  <circle cx="210" cy="150" r="3" fill="#4fc3f7">
    <animate attributeName="r" values="3;4.5;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="150" r="3" fill="#4fc3f7">
    <animate attributeName="r" values="3;4.5;3" dur="3s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Ripple rings (landing at the water line, y=116) -->
  <g fill="none" stroke="#4fc3f7" stroke-width="1.5">
    <ellipse cx="300" cy="116" rx="2" ry="1" opacity="0">
      <animate attributeName="rx" values="2;28" dur="1.2s" begin="0.8s" fill="freeze"/>
      <animate attributeName="ry" values="1;7" dur="1.2s" begin="0.8s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.05;1" dur="1.2s" begin="0.8s" fill="freeze"/>
    </ellipse>
    <ellipse cx="365" cy="116" rx="2" ry="1" opacity="0">
      <animate attributeName="rx" values="2;28" dur="1.2s" begin="1.05s" fill="freeze"/>
      <animate attributeName="ry" values="1;7" dur="1.2s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.05;1" dur="1.2s" begin="1.05s" fill="freeze"/>
    </ellipse>
    <ellipse cx="430" cy="116" rx="2" ry="1" opacity="0">
      <animate attributeName="rx" values="2;28" dur="1.2s" begin="1.3s" fill="freeze"/>
      <animate attributeName="ry" values="1;7" dur="1.2s" begin="1.3s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.05;1" dur="1.2s" begin="1.3s" fill="freeze"/>
    </ellipse>
    <ellipse cx="495" cy="116" rx="2" ry="1" opacity="0">
      <animate attributeName="rx" values="2;28" dur="1.2s" begin="1.55s" fill="freeze"/>
      <animate attributeName="ry" values="1;7" dur="1.2s" begin="1.55s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.05;1" dur="1.2s" begin="1.55s" fill="freeze"/>
    </ellipse>
    <ellipse cx="560" cy="116" rx="2" ry="1" opacity="0">
      <animate attributeName="rx" values="2;28" dur="1.2s" begin="1.8s" fill="freeze"/>
      <animate attributeName="ry" values="1;7" dur="1.2s" begin="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.05;1" dur="1.2s" begin="1.8s" fill="freeze"/>
    </ellipse>
  </g>

  <!-- Splash droplets -->
  <g fill="#81d4fa">
    <circle cx="300" cy="116" r="2.5" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -22" dur="0.8s" begin="0.8s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="0.8s" fill="freeze"/>
    </circle>
    <circle cx="300" cy="116" r="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -18" dur="0.8s" begin="0.82s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="0.82s" fill="freeze"/>
    </circle>
    <circle cx="300" cy="116" r="1.8" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -26" dur="0.8s" begin="0.84s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="0.84s" fill="freeze"/>
    </circle>

    <circle cx="365" cy="116" r="2.5" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -22" dur="0.8s" begin="1.05s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.05s" fill="freeze"/>
    </circle>
    <circle cx="365" cy="116" r="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -18" dur="0.8s" begin="1.07s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.07s" fill="freeze"/>
    </circle>
    <circle cx="365" cy="116" r="1.8" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -26" dur="0.8s" begin="1.09s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.09s" fill="freeze"/>
    </circle>

    <circle cx="430" cy="116" r="2.5" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -22" dur="0.8s" begin="1.3s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.3s" fill="freeze"/>
    </circle>
    <circle cx="430" cy="116" r="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -18" dur="0.8s" begin="1.32s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.32s" fill="freeze"/>
    </circle>
    <circle cx="430" cy="116" r="1.8" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -26" dur="0.8s" begin="1.34s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.34s" fill="freeze"/>
    </circle>

    <circle cx="495" cy="116" r="2.5" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -22" dur="0.8s" begin="1.55s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.55s" fill="freeze"/>
    </circle>
    <circle cx="495" cy="116" r="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -18" dur="0.8s" begin="1.57s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.57s" fill="freeze"/>
    </circle>
    <circle cx="495" cy="116" r="1.8" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -26" dur="0.8s" begin="1.59s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.59s" fill="freeze"/>
    </circle>

    <circle cx="560" cy="116" r="2.5" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 -22" dur="0.8s" begin="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.8s" fill="freeze"/>
    </circle>
    <circle cx="560" cy="116" r="2" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;12 -18" dur="0.8s" begin="1.82s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.82s" fill="freeze"/>
    </circle>
    <circle cx="560" cy="116" r="1.8" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 -26" dur="0.8s" begin="1.84s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;1" dur="0.8s" begin="1.84s" fill="freeze"/>
    </circle>
  </g>

  <!-- Letters drop in one at a time and bounce on landing -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="74" font-weight="800" fill="url(#tg)" text-anchor="middle">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 -12;0 0;0 -4;0 0" keyTimes="0;0.5;0.68;0.8;0.9;1" dur="1.1s" begin="0.2s" fill="freeze"/>
      <text x="300" y="108">X</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.45s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 -12;0 0;0 -4;0 0" keyTimes="0;0.5;0.68;0.8;0.9;1" dur="1.1s" begin="0.45s" fill="freeze"/>
      <text x="365" y="108">Y</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 -12;0 0;0 -4;0 0" keyTimes="0;0.5;0.68;0.8;0.9;1" dur="1.1s" begin="0.7s" fill="freeze"/>
      <text x="430" y="108">R</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.95s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 -12;0 0;0 -4;0 0" keyTimes="0;0.5;0.68;0.8;0.9;1" dur="1.1s" begin="0.95s" fill="freeze"/>
      <text x="495" y="108">I</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 -150;0 0;0 -12;0 0;0 -4;0 0" keyTimes="0;0.5;0.68;0.8;0.9;1" dur="1.1s" begin="1.2s" fill="freeze"/>
      <text x="560" y="108">X</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="430" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#81d4fa" letter-spacing="4" opacity="0">Be Water, My Friend
    <animate attributeName="opacity" values="0;0.9" dur="1s" begin="2s" fill="freeze"/>
  </text>

  <!-- Giggle droplet mascot -->
  <g transform="translate(720, 62)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="2.6s" repeatCount="indefinite"/>
        <path d="M0,-24 C9,-11 15,-2 15,7 A15,15 0 0 1 -15,7 C-15,-2 -9,-11 0,-24 Z" fill="#4fc3f7" opacity="0.9"/>
        <path d="M-7,-8 Q-9,-3 -7,0" fill="none" stroke="#e1f5fe" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
        <circle cx="-5" cy="4" r="2" fill="#060d1a"/>
        <circle cx="5" cy="4" r="2" fill="#060d1a"/>
        <circle cx="-9" cy="9" r="2.2" fill="#81d4fa" opacity="0.6"/>
        <circle cx="9" cy="9" r="2.2" fill="#81d4fa" opacity="0.6"/>
        <path d="M-5,8 Q0,14 5,8" fill="none" stroke="#060d1a" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="24" y="-8" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#81d4fa" opacity="0">hehe
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.3;0.6;0.75;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
