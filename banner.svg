<svg width="860" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="50%" style="stop-color:#0a1f36"/>
      <stop offset="100%" style="stop-color:#081525"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29b6f6"/>
      <stop offset="50%" style="stop-color:#4fc3f7"/>
      <stop offset="100%" style="stop-color:#81d4fa"/>
    </linearGradient>
    <linearGradient id="wave1g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="wave2g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="wave3g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="860" height="200" rx="8"/>
    </clipPath>
    <style>
      .w1 { animation: wave1 6s linear infinite; }
      .w2 { animation: wave2 9s linear infinite; }
      .w3 { animation: wave3 12s linear infinite reverse; }
      .title { animation: fadeup 1.2s ease-out forwards; opacity: 0; }
      .sub   { animation: fadeup 1.2s ease-out 0.5s forwards; opacity: 0; }
      .dot1  { animation: pulse 3s ease-in-out infinite; }
      .dot2  { animation: pulse 3s ease-in-out 1s infinite; }

      @keyframes wave1 {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-860px); }
      }
      @keyframes wave2 {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-860px); }
      }
      @keyframes wave3 {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-860px); }
      }
      @keyframes fadeup {
        0%   { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; r: 3; }
        50%       { opacity: 1;   r: 4.5; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" fill="url(#bg)" rx="8"/>

  <!-- Animated waves clipped to banner -->
  <g clip-path="url(#clip)">

    <!-- Wave layer 1 — deep slow -->
    <g class="w1">
      <path d="
        M0,145
        C60,130 100,160 160,145
        C220,130 260,160 320,145
        C380,130 420,160 480,145
        C540,130 580,160 640,145
        C700,130 740,160 800,145
        C840,135 860,145 860,145
        L860,200 L0,200 Z
      " fill="url(#wave1g)"/>
      <!-- duplicate for seamless loop -->
      <path d="
        M860,145
        C920,130 960,160 1020,145
        C1080,130 1120,160 1180,145
        C1240,130 1280,160 1340,145
        C1400,130 1440,160 1500,145
        C1560,130 1600,160 1660,145
        C1700,135 1720,145 1720,145
        L1720,200 L860,200 Z
      " fill="url(#wave1g)"/>
    </g>

    <!-- Wave layer 2 — mid speed -->
    <g class="w2">
      <path d="
        M0,158
        C80,143 130,168 200,155
        C270,142 310,168 380,155
        C450,142 490,168 560,155
        C630,142 670,168 740,155
        C800,144 840,158 860,155
        L860,200 L0,200 Z
      " fill="url(#wave2g)"/>
      <path d="
        M860,158
        C940,143 990,168 1060,155
        C1130,142 1170,168 1240,155
        C1310,142 1350,168 1420,155
        C1490,142 1530,168 1600,155
        C1660,144 1700,158 1720,155
        L1720,200 L860,200 Z
      " fill="url(#wave2g)"/>
    </g>

    <!-- Wave layer 3 — fast surface ripple -->
    <g class="w3">
      <path d="
        M0,168
        C50,160 90,175 140,168
        C190,161 230,175 280,168
        C330,161 370,175 420,168
        C470,161 510,175 560,168
        C610,161 650,175 700,168
        C750,161 800,170 860,168
        L860,200 L0,200 Z
      " fill="url(#wave3g)"/>
      <path d="
        M860,168
        C910,160 950,175 1000,168
        C1050,161 1090,175 1140,168
        C1190,161 1230,175 1280,168
        C1330,161 1370,175 1420,168
        C1470,161 1510,175 1560,168
        C1610,161 1660,170 1720,168
        L1720,200 L860,200 Z
      " fill="url(#wave3g)"/>
    </g>

  </g>

  <!-- Corner brackets -->
  <line x1="28" y1="18" x2="72" y2="18" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="18" x2="28" y2="58" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="788" y1="18" x2="832" y2="18" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="832" y1="18" x2="832" y2="58" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="182" x2="72" y2="182" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="142" x2="28" y2="182" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="788" y1="182" x2="832" y2="182" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="832" y1="142" x2="832" y2="182" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>

  <!-- Pulsing dots flanking subtitle -->
  <circle class="dot1" cx="318" cy="150" r="3" fill="#4fc3f7"/>
  <circle class="dot2" cx="542" cy="150" r="3" fill="#4fc3f7"/>

  <!-- Title -->
  <text class="title"
    x="430" y="108"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="74"
    font-weight="800"
    text-anchor="middle"
    fill="url(#tg)"
    letter-spacing="10">XYRIX</text>

  <!-- Subtitle -->
  <text class="sub"
    x="430" y="150"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14"
    font-weight="400"
    text-anchor="middle"
    fill="#81d4fa"
    letter-spacing="4"
    opacity="0.9">Be Water, My Friend</text>

</svg>
