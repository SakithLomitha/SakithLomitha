<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="800" height="170">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#81d4fa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="170" fill="#060d1a"/>

  <!-- ripples under each letter -->
  <g fill="none" stroke="#4fc3f7" stroke-width="2">
    <ellipse cx="160" cy="118" rx="0" ry="0" opacity="0">
      <animate attributeName="rx" values="0;60" dur="1.2s" begin="1.2s" fill="freeze"/>
      <animate attributeName="ry" values="0;12" dur="1.2s" begin="1.2s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="1.2s" fill="freeze"/>
    </ellipse>
    <ellipse cx="280" cy="118" rx="0" ry="0" opacity="0">
      <animate attributeName="rx" values="0;60" dur="1.2s" begin="1.35s" fill="freeze"/>
      <animate attributeName="ry" values="0;12" dur="1.2s" begin="1.35s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="1.35s" fill="freeze"/>
    </ellipse>
    <ellipse cx="400" cy="118" rx="0" ry="0" opacity="0">
      <animate attributeName="rx" values="0;60" dur="1.2s" begin="1.5s" fill="freeze"/>
      <animate attributeName="ry" values="0;12" dur="1.2s" begin="1.5s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="1.5s" fill="freeze"/>
    </ellipse>
    <ellipse cx="520" cy="118" rx="0" ry="0" opacity="0">
      <animate attributeName="rx" values="0;60" dur="1.2s" begin="1.65s" fill="freeze"/>
      <animate attributeName="ry" values="0;12" dur="1.2s" begin="1.65s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="1.65s" fill="freeze"/>
    </ellipse>
    <ellipse cx="640" cy="118" rx="0" ry="0" opacity="0">
      <animate attributeName="rx" values="0;60" dur="1.2s" begin="1.8s" fill="freeze"/>
      <animate attributeName="ry" values="0;12" dur="1.2s" begin="1.8s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.2s" begin="1.8s" fill="freeze"/>
    </ellipse>
  </g>

  <!-- letters drop in with a bounce -->
  <g font-family="monospace, sans-serif" font-size="72" font-weight="bold" fill="url(#w)" text-anchor="middle">
    <text x="160" y="100" opacity="0">X
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,14;0,-6;0,0" keyTimes="0;0.6;0.8;1" dur="1s" begin="0.1s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.1s" fill="freeze"/>
    </text>
    <text x="280" y="100" opacity="0">Y
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,14;0,-6;0,0" keyTimes="0;0.6;0.8;1" dur="1s" begin="0.25s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.25s" fill="freeze"/>
    </text>
    <text x="400" y="100" opacity="0">R
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,14;0,-6;0,0" keyTimes="0;0.6;0.8;1" dur="1s" begin="0.4s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.4s" fill="freeze"/>
    </text>
    <text x="520" y="100" opacity="0">I
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,14;0,-6;0,0" keyTimes="0;0.6;0.8;1" dur="1s" begin="0.55s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.55s" fill="freeze"/>
    </text>
    <text x="640" y="100" opacity="0">X
      <animateTransform attributeName="transform" type="translate" values="0,-140;0,14;0,-6;0,0" keyTimes="0;0.6;0.8;1" dur="1s" begin="0.7s" fill="freeze"/>
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze"/>
    </text>
  </g>

  <!-- subtitle -->
  <text x="400" y="160" font-family="monospace, sans-serif" font-size="14" fill="#81d4fa" text-anchor="middle" opacity="0">
    ethical hacking · appsec · malware analysis
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="2s" fill="freeze"/>
  </text>
</svg>
EOF
