<svg xmlns="http://www.w3.org/2000/svg" width="420" height="44" viewBox="0 0 420 44">
  <!-- Shapeless types in first -->
  <text x="30" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" opacity="0">Shapeless
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.8;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- Formless comes second -->
  <text x="142" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" opacity="0">Formless
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.28;0.8;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- Like Water comes last -->
  <text x="244" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" opacity="0">Like Water
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.44;0.8;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- Separators -->
  <text x="128" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#4fc3f7" opacity="0">·
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.28;0.8;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text x="232" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#4fc3f7" opacity="0">·
    <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.36;0.44;0.52;0.8;0.9;1" dur="7s" begin="0s" repeatCount="indefinite"/>
  </text>

  <!-- Rotating loop beside the text -->
  <g>
    <circle cx="12" cy="22" r="7" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 14"/>
    <animateTransform attributeName="transform" type="rotate" values="0 12 22;360 12 22" dur="2.4s" repeatCount="indefinite"/>
  </g>
</svg>
